<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TankRate | Armory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root { --wot-red: #dc3545; --wot-dark: #1a1d20; --wot-gold: #ffc107; --wot-blue: #0dcaf0; }
    body { background-color: #f0f2f5; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .hero-section { background: linear-gradient(135deg, var(--wot-dark) 0%, #343a40 100%); color: white; padding: 60px 0; margin-bottom: 40px; border-bottom: 4px solid var(--wot-red); }
    .tank-card { border: none; border-radius: 12px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); background: white; }
    .tank-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.1) !important; }
    .tier-indicator { background: var(--wot-dark); color: var(--wot-gold); font-weight: 800; padding: 3px 10px; border-radius: 4px; font-size: 0.8rem; letter-spacing: 0.5px; }
    .stat-card { text-align: center; padding: 10px 5px; border-radius: 8px; background: #f8f9fa; border: 1px solid #eee; }
    .stat-label { font-size: 0.6rem; text-transform: uppercase; font-weight: 700; color: #888; display: block; margin-bottom: 2px; }
    .stat-value { font-weight: 800; font-size: 1.1rem; }
    .equip-badge { background: #e9ecef; color: #495057; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; display: inline-block; margin: 0 4px 6px 0; border-left: 3px solid #ced4da; }
    .difficulty-footer { background: #fdfdfd; border-top: 1px solid #f1f1f1; padding: 12px 20px; border-radius: 0 0 12px 12px; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-shield-fill-check text-danger me-2"></i>TankRate</a>
    <div class="ms-auto"><a href="/tanks" class="btn btn-outline-light btn-sm px-3"><i class="bi bi-lock-fill me-1"></i>Admin Portal</a></div>
  </div>
</nav>
<header class="hero-section shadow">
  <div class="container text-center">
    <h1 class="display-5 fw-bold mb-2">Armored Vehicle Gallery</h1>
    <p class="lead opacity-75">Technical intelligence and tactical loadouts for frontline combatants.</p>
  </div>
</header>
<div class="container">
  <div class="row">
    <div class="col-xl-4 col-md-6 mb-4" th:each="tank : ${tanks}">
      <div class="card h-100 shadow-sm tank-card">
        <div class="card-header bg-transparent border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-2">
            <span class="tier-indicator">TIER <span th:text="${tank.tier}">X</span></span>
            <span class="text-uppercase fw-bold text-muted small" style="letter-spacing: 1px;" th:text="${tank.nations}">USSR</span>
          </div>
          <span class="badge rounded-pill bg-danger-subtle text-danger px-3" th:text="${tank.tankClass}">Heavy Tank</span>
        </div>
        <div class="card-body px-4">
          <h3 class="fw-bold text-dark mb-2" th:text="${tank.name}">Maus</h3>
          <p class="text-muted small mb-4" th:text="${tank.description}">Vehicle description...</p>
          <div class="row g-2 mb-4">
            <div class="col-4"><div class="stat-card"><span class="stat-label">Firepower</span><span class="stat-value text-danger" th:text="${tank.difficultyFirepower}">0</span></div></div>
            <div class="col-4"><div class="stat-card"><span class="stat-label">Armor</span><span class="stat-value text-secondary" th:text="${tank.difficultyArmour}">0</span></div></div>
            <div class="col-4"><div class="stat-card"><span class="stat-label">Mobility</span><span class="stat-value text-info" th:text="${tank.difficultyMobility}">0</span></div></div>
          </div>
          <div class="equipment-section">
            <h6 class="small fw-bold text-uppercase mb-2" style="font-size: 0.7rem; color: #aaa;">Recommended Loadout</h6>
            <div th:if="${not #lists.isEmpty(tank.equipment)}">
              <div class="equip-badge" th:each="item : ${tank.equipment}"><i class="bi bi-tools me-1"></i><span th:text="${item.name}">Item</span></div>
            </div>
            <div th:if="${#lists.isEmpty(tank.equipment)}"><span class="text-muted small fst-italic">Field modifications pending...</span></div>
          </div>
        </div>
        <div class="difficulty-footer d-flex justify-content-between align-items-center">
          <span class="text-muted small fw-bold text-uppercase">Skill Floor</span>
          <span class="badge bg-dark text-white px-3 py-2" th:text="${tank.difficultyTank}">Moderate</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
