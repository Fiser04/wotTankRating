<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TankRate | Equipment Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --wot-red: #dc3545;
            --wot-dark: #1a1d20;
            --wot-gold: #ffc107;
        }

        body { background-color: #f0f2f5; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

        /* Card & Header */
        .editor-card { border: none; border-radius: 12px; overflow: hidden; }
        .editor-header {
            background: var(--wot-dark);
            border-bottom: 4px solid var(--wot-red);
            padding: 1.5rem;
        }

        /* Form Styling */
        .form-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #6c757d;
            letter-spacing: 0.5px;
        }
        .form-control {
            border: 1px solid #dee2e6;
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
        }
        .form-control:focus {
            border-color: var(--wot-red);
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.1);
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--wot-dark);
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #dee2e6;
            margin-left: 15px;
        }

        .btn-save {
            background-color: var(--wot-red);
            border: none;
            padding: 0.6rem 2rem;
            font-weight: 600;
            color: white;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .btn-save:hover { background-color: #bb2d3b; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-shield-fill-check text-danger me-2"></i>TankRate
        </a>
        <div class="d-flex gap-2">
            <a href="/tanks" class="btn btn-sm btn-outline-light">Tanks</a>
            <a href="/equipment" class="btn btn-sm btn-light">Equipment</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card editor-card shadow-lg">
                <div class="editor-header text-white">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-gear-wide-connected fs-3 me-3 text-danger"></i>
                        <div>
                            <h4 class="mb-0 fw-bold" th:text="${equipment.id != null} ? 'Modify Module Specs' : 'Register New Module'">Equipment Editor</h4>
                            <small class="opacity-50 text-uppercase" style="font-size: 0.65rem; letter-spacing: 1px;">Technical Inventory Form</small>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/equipment/save}" th:object="${equipment}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="section-title">01. MODULE IDENTITY</div>

                        <div class="mb-4">
                            <label class="form-label">Equipment Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-tag-fill text-muted"></i></span>
                                <input type="text" th:field="*{name}" class="form-control border-start-0" placeholder="e.g. Improved Ventilation" required>
                            </div>
                        </div>

                        <div class="section-title">02. TECHNICAL DATA</div>

                        <div class="mb-4">
                            <label class="form-label">Function & Effects</label>
                            <textarea th:field="*{description}" class="form-control" rows="5" placeholder="Describe how this modification affects vehicle performance (e.g. +10% to loading speed)..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-5 pt-3 border-top">
                            <a href="/equipment" class="text-decoration-none text-muted small fw-bold">
                                <i class="bi bi-arrow-left me-1"></i> BACK TO INVENTORY
                            </a>
                            <div class="gap-2 d-flex">
                                <a href="/equipment" class="btn btn-outline-secondary px-4">Cancel</a>
                                <button type="submit" class="btn btn-save shadow">
                                    <i class="bi bi-cpu-fill me-2"></i>
                                    <span th:text="${equipment.id != null} ? 'Update Records' : 'Authorize Module'">Save</span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="py-4 text-center text-muted small">
    <p>&copy; 2026 TankRate Intelligence Unit</p>
</footer>

</body>
</html>
