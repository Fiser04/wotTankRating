<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TankRate | Command Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root { --wot-red: #dc3545; --wot-dark: #1a1d20; --wot-gold: #ffc107; --wot-blue: #0dcaf0; }
    body { background-color: #f4f7f6; font-family: 'Inter', sans-serif; }
    .admin-header { background: var(--wot-dark); color: white; padding: 30px 0; border-bottom: 4px solid var(--wot-red); margin-bottom: 30px; }
    .list-card { border: none; border-radius: 10px; background: white; border-left: 5px solid #dee2e6; }
    .list-card.heavy { border-left-color: var(--wot-red); }
    .list-card.medium { border-left-color: var(--wot-gold); }
    .list-card.light { border-left-color: var(--wot-blue); }
    .mini-stat { background: #f8f9fa; border-radius: 6px; padding: 5px 10px; text-align: center; min-width: 60px; border: 1px solid #eee; }
    .mini-stat-label { font-size: 0.6rem; text-transform: uppercase; color: #888; display: block; }
    .mini-stat-value { font-weight: 700; font-size: 0.9rem; }
    .admin-tier { font-weight: 900; color: var(--wot-gold); background: var(--wot-dark); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; }
    .action-btn { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-shield-shaded text-danger me-2"></i>TankRate</a>
    <div class="navbar-nav ms-auto gap-2"><a href="/tanks" class="btn btn-sm btn-light">Tanks</a><a href="/equipment" class="btn btn-sm btn-outline-light">Equipment</a></div>
  </div>
</nav>
<header class="admin-header shadow">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-8"><h1 class="h3 fw-bold mb-1">Combat Records Manager</h1><p class="mb-0 text-white-50">Total Vehicles: <span class="text-white fw-bold" th:text="${tanks.size()}">0</span></p></div>
      <div class="col-md-4 text-md-end"><a th:href="@{/tanks/new}" class="btn btn-danger px-4 fw-bold shadow-sm">+ Register New Tank</a></div>
    </div>
  </div>
</header>
<div class="container">
  <div class="row" th:each="tank : ${tanks}">
    <div class="col-12 mb-3">
      <div class="card list-card shadow-sm h-100" th:classappend="${#strings.toLowerCase(tank.tankClass)}">
        <div class="card-body py-3 px-4">
          <div class="row align-items-center">
            <div class="col-md-3">
              <div class="d-flex align-items-center mb-1">
                <span class="admin-tier me-2" th:text="${tank.tier}">TX</span>
                <span class="fw-bold text-muted me-2" style="font-size: 0.75rem;" th:text="${tank.nations}">USSR</span>
                <h5 class="mb-0 fw-bold" th:text="${tank.name}">Name</h5>
              </div>
              <span class="badge bg-secondary-subtle text-secondary small" style="font-size: 0.7rem;" th:text="${tank.tankClass}">HEAVY</span>
            </div>
            <div class="col-md-4">
              <div class="d-flex gap-2">
                <div class="mini-stat"><span class="mini-stat-label">Fire</span><span class="mini-stat-value text-danger" th:text="${tank.difficultyFirepower}">0</span></div>
                <div class="mini-stat"><span class="mini-stat-label">Armor</span><span class="mini-stat-value text-secondary" th:text="${tank.difficultyArmour}">0</span></div>
                <div class="mini-stat"><span class="mini-stat-label">Mob</span><span class="mini-stat-value text-info" th:text="${tank.difficultyMobility}">0</span></div>
                <div class="mini-stat bg-dark text-white"><span class="mini-stat-label text-white-50">Skill</span><span class="mini-stat-value" th:text="${tank.difficultyTank}">0</span></div>
              </div>
            </div>
            <div class="col-md-3 text-muted small"><i class="bi bi-tools me-2"></i><strong th:text="${tank.equipment != null ? tank.equipment.size() : 0}">0</strong>/3 Modules</div>
            <div class="col-md-2 text-end">
              <div class="btn-group">
                <a th:href="@{/tanks/edit/{id}(id=${tank.id})}" class="btn btn-outline-dark action-btn me-2"><i class="bi bi-pencil-square"></i></a>
                <form th:action="@{/tanks/delete/{id}(id=${tank.id})}" method="post" style="display:inline;"><button type="submit" class="btn btn-outline-danger action-btn"><i class="bi bi-trash3"></i></button></form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
